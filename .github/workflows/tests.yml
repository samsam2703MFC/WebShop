name: Tests

# POURQUOI CE WORKFLOW EXISTE.
# Cinq fichiers de test vivaient dans php-api/tests/ et AUCUN ne tournait : le
# dépôt n'avait pas de workflow de test. Ils ne pouvaient s'exécuter que
# manuellement, sur une base réelle — autant dire jamais. Pendant ce temps, la
# divergence que visibilite_test.php existe pour empêcher est revenue deux fois
# en une matinée : la barre de catégories et la grille de produits ont cessé de
# dire la même chose, puis le diagnostic a continué d'annoncer « Catégorie
# désactivée » après que la barre eut cessé de filtrer là-dessus.
#
# Un test qui ne tourne pas est un commentaire. Celui-ci tourne à chaque
# poussée et à chaque pull request, AVANT que le déploiement ne parte.
#
# LE SOCLE. ws_products et ws_categories ne sont créées par aucune migration —
# elles viennent de l'ERP. On ne peut donc pas reconstruire la base en rejouant
# les 71 migrations : il manque le socle. php-api/tests/socle_test.sql fournit
# le minimum — dumpé APRÈS migrations, il porte déjà les colonnes qu'elles
# ajoutent — et jeu_essai.sql un produit par raison de refus.
#
# LES MIGRATIONS RÉCENTES SONT REJOUÉES, LES ANCIENNES NON. La 0003 référence
# ws_shops, table d'avant l'unification vers shops, et s'arrête sur « Table
# citest.ws_shops doesn't exist » : les anciennes supposent des états de l'ERP
# qui n'existent plus, et les rejouer depuis zéro testerait l'HISTORIQUE du
# schéma, pas le code d'aujourd'hui.
#
# CET EN-TÊTE A LONGTEMPS DIT L'INVERSE — « les migrations ne sont pas rejouées
# ici » — en concluant lui-même : « CE QUE ÇA LAISSE NON COUVERT : qu'une
# NOUVELLE migration passe. » Le trou était écrit en toutes lettres, et il a
# fini par coûter ce qu'il annonçait : la 0070 est partie en production, s'est
# arrêtée sur une clé étrangère, et migrate.sh étant fail-fast, elle a bloqué
# TOUS les déploiements derrière elle. D'où l'étape plus bas, qui rejoue les
# migrations POSTÉRIEURES au niveau du socle (php-api/tests/socle_niveau.txt) —
# deux fois, pour vérifier qu'elles sont idempotentes EN SÉQUENCE et pas
# seulement isolément. Ce second passage a trouvé aussitôt une 0071 qui
# recréait la colonne que la 0072 venait de renommer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: mariadb:10.11        # même version majeure que le serveur
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: citest
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'        # même version majeure que le serveur
          extensions: pdo_mysql, mbstring, gd

      # ORDRE : socle → jeu d'essai → migrations → jeu d'essai post.
      # Il n'est pas interchangeable, et les deux contraintes se contredisent en
      # apparence :
      #   · les migrations doivent s'appliquer à une base PEUPLÉE, sinon une
      #     migration qui recopie des données ne révèle jamais ses violations de
      #     contrainte — sur une base vide elle passe, et c'est ainsi que la
      #     0070 est arrivée en production ;
      #   · mais une donnée qui s'appuie sur une colonne créée par une migration
      #     ne peut pas la précéder.
      # D'où deux fichiers de données, avant et après.
      - name: Base de test — socle puis jeu d'essai (base PEUPLÉE)
        run: |
          set -euo pipefail
          M="mysql -h 127.0.0.1 -P 3306 -u root -proot citest"
          $M < php-api/tests/socle_test.sql
          $M < php-api/tests/jeu_essai.sql
          cat > php-api/config.php <<'PHP'
          <?php return ['db' => ['host' => '127.0.0.1', 'port' => 3306, 'name' => 'citest',
                                 'user' => 'root', 'pass' => 'root'],
                        'admin_token' => 'jeton-de-test', 'debug' => true,
                        'cors_origins' => ['*'], 'mail_from' => 'test@example.invalid',
                        'webshop_base' => 'http://localhost/webshop'];
          PHP

      # LE TROU PAR LEQUEL LA PRODUCTION A ÉTÉ BLOQUÉE, DEUX FOIS DANS LA MÊME
      # JOURNÉE. migrate.sh est FAIL-FAST : une migration qui échoue empêche
      # tous les déploiements suivants, pas seulement le sien. Et rien ne les
      # essayait avant la production — c'était écrit dans cet en-tête, en toutes
      # lettres, sans être corrigé :
      #   « CE QUE ÇA LAISSE NON COUVERT : qu'une NOUVELLE migration passe. »
      # La 0070 y est passée et a tout bloqué sur une clé étrangère.
      #
      # On ne rejoue PAS les anciennes (la 0003 suppose un schéma disparu) : on
      # rejoue celles qui SUIVENT le niveau du socle. C'est exactement la
      # question qui compte — « cette nouvelle migration s'applique-t-elle sur
      # la production d'aujourd'hui ? » — et elle se pose ici, pas après le
      # rsync.
      - name: Les nouvelles migrations s'appliquent sur le socle
        run: |
          set -euo pipefail
          NIV=$(tr -dc '0-9' < php-api/tests/socle_niveau.txt)
          echo "socle à jour jusqu'à la migration $NIV — on rejoue les suivantes"
          M="mysql -h 127.0.0.1 -P 3306 -u root -proot citest"
          n=0
          for f in php-api/migrations/*.sql; do
            v=$(basename "$f"); num=$(printf '%s' "$v" | cut -c1-4)
            case "$num" in ''|*[!0-9]*) continue ;; esac
            [ "$num" -le "$NIV" ] 2>/dev/null && continue
            echo "→ $v"
            $M < "$f"                      # set -e : la première qui échoue arrête le job
            n=$((n+1))
          done
          [ "$n" = "0" ] && echo "(aucune migration postérieure au socle)" || echo "$n migration(s) appliquée(s) sans erreur"
          # REJOUÉES UNE SECONDE FOIS : la convention du dépôt veut qu'une
          # migration soit idempotente. Si la seconde passe échoue, elle ne
          # l'est pas — et elle casserait un redéploiement.
          for f in php-api/migrations/*.sql; do
            v=$(basename "$f"); num=$(printf '%s' "$v" | cut -c1-4)
            case "$num" in ''|*[!0-9]*) continue ;; esac
            [ "$num" -le "$NIV" ] 2>/dev/null && continue
            $M < "$f"
          done
          echo "rejouées une seconde fois : idempotentes"

      - name: Jeu d'essai — ce qui dépend des colonnes créées par les migrations
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot citest < php-api/tests/jeu_essai_post.sql

      - name: Visibilité — le diagnostic dit-il la même chose que le catalogue ?
        run: php php-api/tests/visibilite_test.php

      - name: Totaux du panier
        run: node php-api/tests/totaux_test.cjs

      - name: Promotions cumulatives
        run: php php-api/tests/promo_cumulative_test.php

      - name: Rendu des e-mails
        run: php php-api/tests/mail_render_test.php

      - name: QR
        run: php php-api/tests/qr_test.php

      - name: Numéro de la fiche pour le SMS (indicatif respecté)
        run: php php-api/tests/tel_fiche_test.php

      - name: Syntaxe PHP de toute l'API
        run: find php-api -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      # TypeScript sert UNIQUEMENT d'analyseur syntaxique JSX : le webshop
      # compile son JSX dans le navigateur, il n'y a donc aucune étape de build
      # entre le commit et le client. Une parenthèse manquante part telle quelle
      # en production. Installé sans être ajouté au projet — pas une dépendance.
      - name: Les .jsx du webshop parsent
        run: |
          npm install --no-save --no-audit --no-fund typescript
          node php-api/tests/jsx_parse_test.cjs
