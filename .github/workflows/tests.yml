name: Tests

# POURQUOI CE WORKFLOW EXISTE.
# Cinq fichiers de test vivaient dans php-api/tests/ et AUCUN ne tournait : le
# dépôt n'avait pas de workflow de test. Ils ne pouvaient s'exécuter que
# manuellement, sur une base réelle — autant dire jamais. Pendant ce temps, la
# divergence que visibilite_test.php existe pour empêcher est revenue deux fois
# en une matinée : la barre de catégories et la grille de produits ont cessé de
# dire la même chose, puis le diagnostic a continué d'annoncer « Catégorie
# désactivée » après que la barre eut cessé de filtrer là-dessus.
#
# Un test qui ne tourne pas est un commentaire. Celui-ci tourne à chaque
# poussée et à chaque pull request, AVANT que le déploiement ne parte.
#
# LE SOCLE. ws_products et ws_categories ne sont créées par aucune migration —
# elles viennent de l'ERP. On ne peut donc pas reconstruire la base en rejouant
# les 71 migrations : il manque le socle. php-api/tests/socle_test.sql fournit
# le minimum, jeu_essai.sql un produit par raison de refus. Les migrations sont
# ensuite appliquées PAR-DESSUS, ce qui vérifie du même coup qu'elles passent
# sur une base neuve — une migration qui échoue bloque tous les déploiements
# suivants, c'est arrivé et ça a coûté sept commits.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      db:
        image: mariadb:10.11        # même version majeure que le serveur
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: citest
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'        # même version majeure que le serveur
          extensions: pdo_mysql, mbstring, gd

      - name: Base de test — socle, jeu d'essai, puis migrations par-dessus
        run: |
          set -euo pipefail
          M="mysql -h 127.0.0.1 -P 3306 -u root -proot citest"
          $M < php-api/tests/socle_test.sql
          $M < php-api/tests/jeu_essai.sql
          cat > php-api/config.php <<'PHP'
          <?php return ['db' => ['host' => '127.0.0.1', 'port' => 3306, 'name' => 'citest',
                                 'user' => 'root', 'pass' => 'root'],
                        'admin_token' => 'jeton-de-test', 'debug' => true,
                        'cors_origins' => ['*'], 'mail_from' => 'test@example.invalid',
                        'webshop_base' => 'http://localhost/webshop'];
          PHP

      - name: Visibilité — le diagnostic dit-il la même chose que le catalogue ?
        run: php php-api/tests/visibilite_test.php

      - name: Totaux du panier
        run: node php-api/tests/totaux_test.cjs

      - name: Promotions cumulatives
        run: php php-api/tests/promo_cumulative_test.php

      - name: Rendu des e-mails
        run: php php-api/tests/mail_render_test.php

      - name: QR
        run: php php-api/tests/qr_test.php

      - name: Syntaxe PHP de toute l'API
        run: find php-api -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      # TypeScript sert UNIQUEMENT d'analyseur syntaxique JSX : le webshop
      # compile le JSX dans le navigateur (Babel standalone), il n'y a donc
      # aucune étape de build qui aurait signalé une parenthèse manquante.
      # Installé sans être ajouté au projet — ce n'est pas une dépendance.
      - name: Le bundle du webshop parse
        run: |
          npm install --no-save --no-audit --no-fund typescript
          node -e "
            const ts = require('typescript'), fs = require('fs');
            let ko = 0;
            for (const f of fs.readdirSync('.').filter(x => x.endsWith('.jsx'))) {
              const sf = ts.createSourceFile(f, fs.readFileSync(f, 'utf8'),
                                             ts.ScriptTarget.ES2020, true, ts.ScriptKind.JSX);
              const d = sf.parseDiagnostics || [];
              if (d.length) { ko++; console.log('✕ ' + f + ' : ' +
                ts.flattenDiagnosticMessageText(d[0].messageText, ' ')); }
            }
            if (ko) process.exit(1);
            console.log('✓ tous les .jsx parsent');
          "
