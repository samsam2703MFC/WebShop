name: Deploy to server (SSH / rsync)

# Builds the PWA and pushes BOTH the frontend and the PHP API to the client's
# server over SSH (rsync). Same origin: frontend at the web root, API at /api →
# no CORS, and api-config.js auto-detects the API at /api.
#
# ─── One-time setup (GitHub → Settings → Secrets and variables → Actions) ─────
#   Secrets:
#     SSH_HOST       server IP/host, e.g. 185.180.206.46
#     SSH_USER       ssh user (e.g. a dedicated deploy user — see note below)
#     SSH_PASSWORD   that user's password
#   Variables:
#     DEPLOY_ENABLED set to  true   to turn this workflow on (dormant otherwise)
#   Optional variables (per-project isolation):
#     SSH_PORT       ssh port (default 22)
#     WEB_ROOT       this project's DocumentRoot (default /var/www/html)
#                    e.g. /var/www/atelierby/public  — frontend lands here, API at <WEB_ROOT>/api
#     SITE_BASE      base path the site is served at (default /). Use / for a
#                    domain/subdomain/port root; use /atelierby/ only if served on a subpath.
#
#   Notes:
#   • config.php is gitignored → it is NEVER uploaded, so the server's real
#     config.php (with DB credentials) is preserved across every deploy.
#   • rsync runs WITHOUT --delete, so nothing on the server is wiped — EXCEPT a
#     targeted --delete on the migrations/ folder only (no secrets there), so
#     retired migrations can't linger and wedge migrate.sh.
#   • SECURITY: prefer a dedicated non-root deploy user + SSH key over the root
#     password. To switch to a key, replace the sshpass lines with an ssh-agent
#     key and drop SSH_PASSWORD.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Dormant until you set the repository variable DEPLOY_ENABLED = true.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build frontend (served from web root)
        env:
          SITE_BASE: ${{ vars.SITE_BASE || '/' }}
        run: npm run build

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Prepare remote directories (validates SSH login)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ vars.WEB_ROOT || '/var/www/html' }}/api' && command -v rsync >/dev/null || (echo 'rsync manquant sur le serveur — apt-get install -y rsync'; exit 1)"

      - name: Deploy PHP API → ${{ vars.WEB_ROOT || '/var/www/html' }}/api
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -rltDz --omit-dir-times \
            -e "ssh -p ${{ vars.SSH_PORT || '22' }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            php-api/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.WEB_ROOT || '/var/www/html' }}/api/"

      # Purge les migrations OBSOLÈTES côté serveur : le rsync principal n'utilise
      # pas --delete (pour préserver config.php à la racine de l'API), donc un
      # fichier de migration retiré du repo restait sur le serveur et pouvait
      # bloquer migrate.sh (fail-fast) — c'est ce qui est arrivé avec
      # 0008_shops_unify_phase1.sql. Ce rsync ciblé --delete sur le SEUL dossier
      # migrations/ (aucun secret n'y vit) fait du repo la source de vérité.
      - name: Prune stale server-side migrations (repo = source of truth)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -rltDz --omit-dir-times --delete \
            -e "ssh -p ${{ vars.SSH_PORT || '22' }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            php-api/migrations/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.WEB_ROOT || '/var/www/html' }}/api/migrations/"

      # Applique les migrations SQL non encore jouées (idempotent, versionné).
      # migrate.sh vient d'être rsyncé avec l'API ; il lit config.php pour les creds.
      - name: Run DB migrations (idempotent, tracked)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash '${{ vars.WEB_ROOT || '/var/www/html' }}/api/migrate.sh'"

      - name: Deploy frontend → ${{ vars.WEB_ROOT || '/var/www/html' }}
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -rltDz --omit-dir-times \
            -e "ssh -p ${{ vars.SSH_PORT || '22' }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.WEB_ROOT || '/var/www/html' }}/"

      # Le front est bâti par Vite dans un bundle HACHÉ, puis rsyncé. Vérifier
      # que le marqueur existe quelque part sous assets/ ne suffit pas : encore
      # faut-il que la PAGE SERVIE pointe vers CE fichier-là. Un index.html
      # resté en place référencerait les anciens hachages, et le navigateur
      # recevrait l'ancien design alors que le nouveau dort à côté.
      # On refait donc le chemin du navigateur : page → assets référencés →
      # marqueurs. Les en-têtes de cache sont affichés, parce qu'ils décident
      # de la vitesse à laquelle l'appareil verra le changement.
      - name: Vérifier que la page servie porte bien les derniers changements
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          distant() {
            sshpass -e ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "$SSH_TARGET" "$1" 2>/dev/null
          }
          URL=http://localhost/webshop/
          HTML=$(distant "curl -sf '$URL'")
          if [ -z "$HTML" ]; then echo "La page $URL n a pas repondu."; exit 1; fi
          CSS=$(printf '%s' "$HTML" | grep -o 'assets/index-[A-Za-z0-9_-]*\.css' | head -1)
          JS=$(printf '%s' "$HTML"  | grep -o 'assets/index-[A-Za-z0-9_-]*\.js'  | head -1)
          echo "page servie -> CSS: ${CSS:-<aucun>}   JS: ${JS:-<aucun>}"
          fail=0
          verifie() {   # $1 = asset, $2 = marqueur, $3 = ce qu il prouve
            if [ -z "$1" ]; then echo "ABSENT   $3 (asset non reference par la page)"; fail=1; return; fi
            n=$(distant "curl -sf 'http://localhost/webshop/$1' | grep -cF -- '$2'" | tr -d ' \r')
            if [ "${n:-0}" -ge 1 ] 2>/dev/null; then echo "OK       $3"
            else echo "ABSENT   $3   (marqueur absent de $1)"; fail=1; fi
          }
          # Un marqueur PRESENT ne prouve pas que l ancien code a disparu : les deux
          # peuvent cohabiter dans le meme bundle si un ecran n a pas ete repris.
          # On verifie donc aussi des ABSENCES — ici, l ancienne liste deroulante
          # de bureaux, qui existait en DEUX exemplaires et dont un seul avait
          # ete remplace.
          absent() {   # $1 = asset, $2 = marqueur qui ne doit PLUS exister, $3 = quoi
            if [ -z "$1" ]; then return; fi
            n=$(distant "curl -sf 'http://localhost/webshop/$1' | grep -cF -- '$2'" | tr -d ' \r')
            if [ "${n:-0}" = "0" ]; then echo "OK       $3"
            else echo "ENCORE LA  $3   ($n occurrence(s) dans $1)"; fail=1; fi
          }
          verifie "$CSS" 'ws-acc__pick-item'  'recherche de societe (liste deroulante remplacee)'
          verifie "$CSS" 'ws-mode__lbl-full'  'libelles du selecteur de mode en mobile'
          verifie "$JS"  'Rechercher une '    'placeholder de la recherche de societe'
          absent  "$JS"  'lectionner un bureau' 'plus aucune liste deroulante de bureaux'
          absent  "$JS"  'lectionnez un bureau —' 'plus aucun libelle de deroulante residuel'
          # Sans Cache-Control, le navigateur applique sa fraicheur heuristique et
          # garde la page : le deploiement est en ligne sans etre visible sur
          # l appareil. C est ce qui s est produit, et ca ressemble a un bug de
          # mise en page. Le .htaccess du webshop doit donc etre pris en compte.
          echo "en-tetes de la page :"
          HDRS=$(distant "curl -sI '$URL'")
          printf '%s' "$HDRS" | grep -i '^\(cache-control\|etag\|last-modified\|expires\)' | sed 's/^/  /'
          if printf '%s' "$HDRS" | grep -qi '^cache-control:.*no-cache'; then
            echo "OK       page revalidee a chaque visite (Cache-Control present)"
          else
            echo "ATTENTION  aucun Cache-Control no-cache sur la page : l appareil peut garder"
            echo "           une copie perimee. Verifier qu Apache lit le .htaccess deploye"
            echo "           (AllowOverride) et que mod_headers est actif."
          fi
          SWH=$(distant "curl -sI 'http://localhost/webshop/sw.js'")
          if printf '%s' "$SWH" | grep -qi '^cache-control:.*no-cache'; then
            echo "OK       service worker revalide (sinon l app installee reste figee)"
          else
            echo "ATTENTION  sw.js sans no-cache : une PWA installee peut rester sur une"
            echo "           version ancienne indefiniment."
          fi
          if [ "$fail" != "0" ]; then
            echo "La page servie ne porte pas le build qui vient d etre deploye."
            exit 1
          fi

      # Renseigne ws_products.img d'après les photos déposées sous assets/product_pictures/
      # (idempotent, non destructif). À FAIRE APRÈS le déploiement du front (les photos
      # arrivent avec dist/). Toute nouvelle photo {id}.png|jpg est ainsi câblée à son
      # produit sans SQL manuel, pour tous les consommateurs (webshop, PWA).
      - name: Sync product photos → ws_products.img (idempotent)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "php '${{ vars.WEB_ROOT || '/var/www/html' }}/api/sync_product_images.php'"

      # Standalone B2B landing page — shipped as-is (NOT part of the PWA build).
      # The public URL /landing is an Apache alias to /var/www/latelierby-landing
      # (see the server's catch-all vhost: `Alias /landing /var/www/latelierby-landing`).
      # This repo owns ONLY the B2B "Événements" landing, which lives under the
      # /landing/b2b/ sub-folder. Everything else in /landing (home, /office,
      # shared fonts/img/assets, redirects) is owned by the `landing` repo — so
      # we deploy strictly into the b2b/ sub-folder and never touch the root,
      # otherwise the two deployments overwrite each other's files.
      - name: Deploy B2B landing → /landing/b2b (alias → /var/www/latelierby-landing/b2b)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -rltDz --omit-dir-times \
            -e "ssh -p ${{ vars.SSH_PORT || '22' }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            landing/b2b/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.LANDING_DIR || '/var/www/latelierby-landing' }}/b2b/"
          echo "Verifying the B2B page served at /landing/b2b is the freshly-deployed build…"
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "curl -s http://localhost/landing/b2b/evenements-b2b.html | grep -o 'webshop-landing-b2b.js?v=[0-9]*' | head -1 || echo 'WARN: version marker not found in served page'"
