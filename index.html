<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>L'Atelier By · Webshop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8D1D2C">
<!-- CLAIR, TOUJOURS : sans color-scheme, Chrome Android « auto-assombrit »
     la page pour les téléphones en mode sombre — écran noir constaté en test.
     La charte du webshop est claire ; on le déclare, le navigateur n'invente
     plus de thème. Le fond est posé sur html/body pour que même la première
     peinture (avant le chargement du script) soit de la bonne couleur. -->
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png">
<link rel="icon" href="%BASE_URL%favicon-32.png">
<!-- PWA : plein écran (standalone) quand le site est ajouté à l'écran
     d'accueil — plus de barre du navigateur, comportement d'app. -->
<link rel="manifest" href="%BASE_URL%manifest.webmanifest">
<style>
  :root { color-scheme: only light; }
  html, body, #root { height: 100%; margin: 0; background: #EAE4DC; }
  #root { display: flex; }
  #root > .ws { flex: 1; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
